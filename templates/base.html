<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stielvoll – Gartencenter{% endblock %}</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <nav>
      <a class="brand" href="{{ url_for('index') }}">
        <svg class="brand-leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21c0-9 5-15 15-17-1 10-7 15-15 17zm0 0c3-4 6-7 10-10"/></svg>
        Stielvoll
      </a>
      <ul>
        {% for endpoint, label in nav_items %}
        <li><a href="{{ url_for(endpoint) }}"{% if request.endpoint and request.endpoint.split('_')[0] == endpoint %} class="active" aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>Stielvoll Gartencenter</strong> · Musterstrasse 12 · 8000 Zürich</p>
      <p>&copy; 2026 Stielvoll · <a href="{{ url_for('admin_login') }}">Administration</a></p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
